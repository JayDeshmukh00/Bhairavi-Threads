<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Obsidian Silk Background -->
  <rect width="512" height="512" rx="110" fill="#0A0A0A"/>

  <!-- Subtle Luxury Gold Circular Frame -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Artistic 'BT' Monogram -->
  <g fill="none" stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Stylized Letter 'B' -->
    <path d="M 145 130 L 145 382" stroke-width="24"/>
    <path d="M 145 130 C 250 130, 290 175, 255 220 C 305 250, 290 320, 145 382" stroke-width="22"/>
    
    <!-- Elegant Negative Space Weave Curves inside 'B' -->
    <path d="M 172 155 C 220 155, 240 180, 210 200" stroke-width="6" stroke-opacity="0.7"/>
    <path d="M 172 245 C 235 245, 260 280, 220 325" stroke-width="6" stroke-opacity="0.7"/>

    <!-- Stylized Letter 'T' Interwoven Gracefully -->
    <path d="M 270 130 L 395 130" stroke-width="22"/>
    <path d="M 332 130 L 332 382" stroke-width="20"/>
  </g>

  <!-- Minimalist Zari Accent Dot -->
  <circle cx="332" cy="382" r="6" fill="#D4AF37" stroke="none"/>
</svg>
